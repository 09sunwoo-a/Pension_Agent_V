<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="format-detection" content="telephone=no">
  <title>퇴직연금 AI 대시보드</title>
  <!-- TODO: 실제 배포 path로 변경 -->
  <link rel="stylesheet" href="/mnbank/app/css/bfe/pension/pensionAgentDemo.css">
  <script id="PENSION_AGENT_DEMO" src="/mnbank/app/js/bfe/pension/pensionAgentDemo.js"></script>
</head>
<body>
  <div id="pensionAgentDemo">
    <template id="pensionAgentTemplate">
<div class="pad-root">

<sc-if value="{{ bridgeOn }}">
<div class="pad-bridge" style="opacity:{{ bridgeOpacity }}">
<div class="pad-bridge__box">
<div class="pad-bridge__head">
<span class="pad-bridge__dot"></span>
<span class="pad-bridge__title">{{ bridgeName }} 고객 브리핑 준비</span>
</div>
<div class="pad-bridge__status">
<span class="pad-spinner"></span>
<span class="pad-bridge__msg">브리핑 로딩 중…</span>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{ showDashboard }}">
<div class="pad-topbar">
<div class="pad-row pad-g10">
<span aria-label="KB국민은행" class="pad-logo">KB</span>
<div class="pad-topbar__title">퇴직연금 사후관리 에이전트</div>
<div class="pad-vsep"></div><div class="pad-t-13-muted">여의도종합금융센터</div>
</div>
<div class="pad-row pad-g12">
<div class="pad-rel">
<div class="pad-search">
<input placeholder="고객 검색 — 이름·고객번호" sc-camel-on-change="{{ onSearchInput }}" value="{{ searchQ }}" class="pad-search__input"/>
<button sc-camel-on-click="{{ doSearch }}" title="검색" class="pad-search__btn">
<svg height="12" sc-camel-view-box="0 0 16 16" width="12"><circle cx="7" cy="7" fill="none" r="4.5" stroke="#26282C" stroke-width="1.8"></circle><line stroke="#26282C" stroke-linecap="round" stroke-width="1.8" x1="10.5" x2="13.5" y1="10.5" y2="13.5"></line></svg>
</button>
</div>
<sc-if value="{{ searchOpen }}">
<div class="pad-search__pop">
<sc-for as="r" list="{{ searchResults }}">
<div sc-camel-on-click="{{ r.onTap }}" class="pad-search__item">
<span class="pad-t-13b">{{ r.name }}</span>
<span class="pad-tag">{{ r.product }}</span>
<span class="pad-tag-c" style="color:{{ r.tagFg }};background:{{ r.tagBg }}">{{ r.tag }}</span>
<span class="pad-search__meta">{{ r.cno }} · {{ r.phone }}</span>
</div>
</sc-for>
<sc-if value="{{ searchEmpty }}">
<div class="pad-search__empty">일치하는 고객이 없습니다</div>
</sc-if>
</div>
</sc-if>
</div>
<div class="pad-status-pill">
<span class="pad-status-pill__dot"></span>오전 7:30 · IRP 고객 1,247명 분석 완료
    </div>
</div>
</div>
</sc-if>
<sc-if value="{{ showDashboard }}">
<div class="pad-dash">
<div class="pad-dash__top">
<div class="pad-brief-card">
<div class="pad-rowb pad-between pad-g10 pad-mb6"><span class="pad-t-kicker">오늘의 부점 브리핑 · 9월 4일 금요일</span></div>
<div class="pad-brief-card__body pad-in">전일 대비 <span class="pad-b">ISA 만기 예정 고객</span> <span sc-camel-on-click="{{ filterNew }}" class="pad-hl-link">3명이 신규 관리대상</span>으로 선정됐습니다.<br/>현재 KB스타뱅킹에서 <span class="pad-b">ISA 만기자금의 IRP 전환 관련 이벤트</span>가 진행 중인 만큼,<br/>해당 고객군을 우선 확인해 만기자금 활용계획을 점검하고 이벤트를 함께 안내해 보세요.</div>
<div class="pad-t-13-muted pad-mt8 pad-keep">전일·금일 고객상태 및 관리신호 분석 · 09.04 07:30 기준</div>
</div><div class="pad-progress-card">
<div class="pad-t-kicker">오늘의 사후관리 현황</div>
<div class="pad-col pad-g4">
<div class="pad-rowb pad-between pad-g8">
<span class="pad-t-12b-sub">부점 전체</span>
<span class="pad-t-12-muted"><span class="pad-t-14b-dark">{{ branchDone }}</span> / 15명 관리완료</span>
</div>
<div class="pad-bar"><div class="pad-bar__fill pad-bar__fill--gray" style="width:{{ branchPct }}"></div></div>
</div>
<div class="pad-col pad-g4">
<div class="pad-rowb pad-between pad-g8">
<span class="pad-t-12b-dark">내 담당</span>
<span class="pad-t-12-muted"><span class="pad-t-14b-dark">{{ doneCount }}</span> / {{ targetCount }}명 관리완료</span>
</div>
<div class="pad-bar"><div class="pad-bar__fill pad-bar__fill--brand" style="width:{{ progressPct }}"></div></div>
</div>
<div class="pad-t-12-sub">내 남은 고객 {{ remainCount }}명</div>
</div>
</div>
<div class="pad-kpi-grid">
<button sc-camel-on-click="{{ kNewTap }}" class="pad-kpi" style="--pad-bd:{{ kNewBd }}">
<div class="pad-min0">
<div class="pad-row pad-g6"><span class="pad-kpi__dot"></span><span class="pad-t-13b-dark">신규 선정</span><sc-if value="{{ kNewOn }}"><span class="pad-t-11b-dark">✓ 필터 적용 중</span></sc-if></div>
<div class="pad-t-12-muted pad-mt3 pad-keep">오늘 새롭게 우선관리</div>
</div>
<span class="pad-kpi__num pad-c-dark">15명</span>
</button>
<button sc-camel-on-click="{{ kOnTap }}" class="pad-kpi" style="--pad-bd:{{ kOnBd }}">
<div class="pad-min0">
<div class="pad-row pad-g6"><span class="pad-t-13b-dark">지속 관리</span><sc-if value="{{ kOnOn }}"><span class="pad-t-11b-dark">✓ 필터 적용 중</span></sc-if></div>
<div class="pad-t-12-muted pad-mt3 pad-keep">오늘도 관리 필요</div>
</div>
<span class="pad-kpi__num pad-c-dark">12명</span>
</button>
<button sc-camel-on-click="{{ kResTap }}" class="pad-kpi" style="--pad-bd:{{ kResBd }}">
<div class="pad-min0">
<div class="pad-row pad-g6"><span class="pad-t-13b-dark">오늘 방문 예정</span><sc-if value="{{ kResOn }}"><span class="pad-t-11b-ok">✓ 필터 적용 중</span></sc-if></div>
<div class="pad-t-12-muted pad-mt3 pad-keep">금일 영업점 방문 예정</div>
</div>
<span class="pad-kpi__num pad-c-ok">2명</span>
</button>
</div>
<div class="pad-section-head">
<div class="pad-rowb pad-g10">
<div class="pad-h2">오늘의 중점관리 고객 · 15명</div>
<sc-if value="{{ hasCaseLibrary }}"><button class="pad-btn-sm" sc-camel-on-click="{{ openCaseLibrary }}">고객별 브리핑 · 30 케이스</button></sc-if>
<div class="pad-t-12-muted">관리 필요도 순</div>
</div>
<div class="pad-row pad-g6">
<button sc-camel-on-click="{{ filterAll }}" class="pad-chip" style="border:1px solid {{ allBd }};background:{{ allBg }};color:{{ allFg }}">전체</button>
<sc-if value="{{ subChipOn }}">
<button sc-camel-on-click="{{ filterAll }}" class="pad-chip pad-chip--dark">{{ subChipLabel }} ✕</button>
</sc-if>
<div class="pad-vsep2"></div>
<button sc-camel-on-click="{{ extToggle }}" class="pad-chip-ico" style="border:1px solid {{ extBtnBd }};background:{{ extBtnBg }};color:{{ extBtnFg }}">
<svg height="12" sc-camel-view-box="0 0 16 16" width="12"><path d="M2 3h12L9.5 8.5V13l-3-1.5V8.5L2 3Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.6"></path></svg>
        조건 추출
      </button>
<button sc-camel-on-click="{{ xlsTap }}" title="현재 조건 명단 엑셀 다운로드" class="pad-chip-ico pad-chip-ico--line">
<svg height="12" sc-camel-view-box="0 0 16 16" width="12"><path d="M8 2v8M4.5 7 8 10.5 11.5 7M3 13h10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></path></svg>
        엑셀
      </button>
</div>
</div>
<sc-if value="{{ extOpen }}">
<div class="pad-ext pad-in">
<div class="pad-col pad-g9">
<sc-for as="g" list="{{ extGroups }}">
<div class="pad-row pad-g12">
<div class="pad-ext__label">{{ g.label }}</div>
<div class="pad-flex pad-g6 pad-wrap">
<sc-for as="o" list="{{ g.opts }}">
<button sc-camel-on-click="{{ o.onTap }}" class="pad-opt" style="border:1px solid {{ o.bd }};background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button>
</sc-for>
</div>
</div>
</sc-for>
</div>
<div class="pad-ext__foot">
<div class="pad-t-13-sub">조건 일치 <span class="pad-b pad-c-dark">{{ extPreviewN }}명</span></div>
<div class="pad-flex pad-g8">
<button sc-camel-on-click="{{ extReset }}" class="pad-btn pad-btn--line pad-p-6-14">초기화</button>
<button sc-camel-on-click="{{ extApply }}" class="pad-btn pad-btn--brand pad-p-6-16">이 조건으로 추출</button>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{ extOn }}">
<div class="pad-row pad-g6 pad-wrap pad-mb10 pad-in">
<span class="pad-t-12b-muted">내 추출 조건</span>
<sc-for as="ec" list="{{ extChips }}">
<span class="pad-chip-cond">{{ ec.label }}</span>
</sc-for>
<button sc-camel-on-click="{{ extClear }}" class="pad-textbtn pad-p-3-6">모두 해제 ✕</button>
<span class="pad-flex1"></span>
<span class="pad-t-12-sub">{{ extResultN }}명 추출됨</span>
</div>
</sc-if>
<div class="pad-col pad-g8">
<sc-for as="c" list="{{ queue }}">
<div sc-camel-on-click="{{ c.onTap }}" class="pad-queue-item" style="opacity:{{ c.op }};animation:{{ c.anim }}">
<div class="pad-queue-item__bar" style="background:{{ c.bar }}"></div>
<sc-if value="{{ c.done }}">
<svg height="18" sc-camel-view-box="0 0 18 18" width="18" class="pad-none"><circle cx="9" cy="9" fill="#E6F6EF" r="8"></circle><polyline fill="none" points="5.5,9.2 8,11.7 12.5,6.5" stroke="#059669" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></polyline></svg>
</sc-if>
<div class="pad-grow">
<div class="pad-row pad-g8 pad-wrap">
<span class="pad-t-15b">{{ c.name }}</span>
<span class="pad-tag">{{ c.club }}</span>
<sc-if value="{{ c.mgShow }}"><span class="pad-tag-pill" style="color:{{ c.mgFg }};background:{{ c.mgBg }}">{{ c.mg }}</span></sc-if>
<sc-for as="tg" list="{{ c.tags }}">
<span class="pad-tag-lg" style="color:{{ tg.fg }};background:{{ tg.bg }}">{{ tg.t }}</span>
</sc-for>
</div>
<div class="pad-t-13-sub pad-mt4">IRP 잔액 <span class="pad-b pad-c-dark">{{ c.bal }}</span><span class="pad-c-muted"> · </span>1년 수익률 <span class="pad-b" style="color:{{ c.retC }}">{{ c.ret }}</span></div>
</div>
<sc-if value="{{ c.taxOn }}">
<div class="pad-queue-item__tax">
<svg height="30" sc-camel-view-box="0 0 30 30" width="30" class="pad-none pad-ring"><circle cx="15" cy="15" fill="none" r="11.5" stroke="#F2F3F5" stroke-width="5"></circle><circle cx="15" cy="15" fill="none" r="11.5" stroke="{{ c.taxColor }}" stroke-dasharray="{{ c.taxDash }}" stroke-linecap="round" stroke-width="5"></circle></svg>
<div>
<div class="pad-t-12b-dark">공제한도 {{ c.taxPctLabel }}</div>
<div class="pad-t-11-muted pad-mt1">{{ c.taxRemainLabel }}</div>
</div>
</div>
</sc-if>
<sc-if value="{{ c.taxOff }}">
<div class="pad-queue-item__tax-empty"></div>
</sc-if>
<button sc-camel-on-click="{{ c.onDone }}" title="상담완료 체크" class="pad-check-btn" style="--pad-bd:{{ c.ckBd }};--pad-bg:{{ c.ckBg }}">
<svg height="13" sc-camel-view-box="0 0 14 14" width="13" style="opacity:{{ c.ckOp }}"><polyline fill="none" points="3,7.2 5.8,10 11,4.5" stroke="{{ c.ckStroke }}" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"></polyline></svg>
</button>
<svg height="16" sc-camel-view-box="0 0 16 16" width="16" class="pad-chevron"><polyline fill="none" points="6,4 10,8 6,12" stroke="#4E545C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6"></polyline></svg>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{ toastOn }}">
<div class="pad-toast pad-in">{{ toastMsg }}</div>
</sc-if>
<sc-if value="{{ showBriefing }}">
<div class="pad-subbar">
<button sc-camel-on-click="{{ goBack }}" class="pad-nav-btn">
<svg height="14" sc-camel-view-box="0 0 16 16" width="14"><polyline fill="none" points="10,3 5,8 10,13" stroke="#4E545C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></polyline></svg>
    오늘의 큐 <span class="pad-c-muted pad-m">완료 {{ doneCount }}/{{ targetCount }}</span>
</button>
<button sc-camel-on-click="{{ goNext }}" class="pad-nav-btn">
    다음 고객
    <svg height="14" sc-camel-view-box="0 0 16 16" width="14"><polyline fill="none" points="6,3 11,8 6,13" stroke="#4E545C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></polyline></svg>
</button>
</div>
<sc-if value="{{ hasCaseLibrary }}">
<div class="pad-case-picker">
<label for="briefing-case">고객별 브리핑</label>
<select id="briefing-case" aria-label="브리핑 고객 선택" sc-camel-on-change="{{ onCaseChange }}">
<sc-for as="cc" list="{{ caseChoices }}"><option value="{{ cc.id }}" selected="{{ cc.selected }}">{{ cc.label }}</option></sc-for>
</select>
</div>
</sc-if>
<div class="pad-brief-layout">
<div data-scroll-key="briefing-main" class="pad-brief-main">
<div class="pad-brief-inner">
<!-- Build-time fragment: included in the single deployment HTML, no runtime fetch. -->
<sc-if value="{{ fabrixEnabled }}">
<div class="pad-fabrix">
  <div class="pad-fabrix__bar">
    <span class="pad-t-13b">FabriX 연결 테스트</span>
    <span class="pad-t-12-muted">{{ fabrixConfigLabel }}</span>
    <button class="pad-btn-sm" data-fabrix-action="settings" sc-camel-on-click="{{ fabrixToggleSettings }}">연결 설정</button>
    <sc-if value="{{ fabrixCanRequest }}"><button class="pad-btn-sm" data-fabrix-action="request" sc-camel-on-click="{{ fabrixRequest }}">실제 브리핑 호출 / 재요청</button></sc-if>
    <sc-if value="{{ fabrixBusy }}"><button class="pad-btn-sm" data-fabrix-action="cancel" sc-camel-on-click="{{ fabrixCancel }}">요청 취소</button></sc-if>
    <sc-if value="{{ structuredBrief }}"><button class="pad-btn-sm" data-fabrix-action="mock" sc-camel-on-click="{{ fabrixMock }}">더미로 복원</button><span class="pad-t-12b-sub">{{ fabrixOrigin }}</span></sc-if>
  </div>
  <sc-if value="{{ fabrixLegacyNote }}"><div class="pad-t-12-muted">기존 데모는 보존됩니다. 실제 호출은 위 목록에서 대표 사례 또는 30개 고객 중 선택해 주세요.</div></sc-if>
  <sc-if value="{{ fabrixDiagnostic }}"><div class="pad-fabrix__diagnostic" role="status" aria-live="polite">{{ fabrixDiagnosticCode }} · {{ fabrixDiagnostic }}</div></sc-if>
  <sc-if value="{{ fabrixSettingsOpen }}">
  <div class="pad-fabrix__settings">
    <div class="pad-t-12-muted">설정은 현재 화면 메모리에만 보관합니다. 화면 종료·설정 삭제 시 제거됩니다. 실제 호출 시 선택 고객의 시연용 데이터가 전송됩니다.</div>
    <div class="pad-fabrix__fields">
      <label>Endpoint URL<input data-fabrix-config="endpointUrl" type="url" autocomplete="off" placeholder="https://…/prod/kb0/connector-id/1"/></label>
      <label>Agent ID<input data-fabrix-config="agentId" type="number" min="1" autocomplete="off" placeholder="양의 정수"/></label>
      <label>직원 ID<input data-fabrix-config="xClientUser" type="text" autocomplete="off"/></label>
      <label>OpenAPI Token<input data-fabrix-config="openapiToken" type="password" autocomplete="new-password" spellcheck="false"/></label>
      <label>Generative AI Client<input data-fabrix-config="generativeAiClient" type="password" autocomplete="new-password" spellcheck="false"/></label>
    </div>
    <sc-if value="{{ fabrixSettingsError }}"><div class="pad-warn-note">{{ fabrixSettingsError }}</div></sc-if>
    <div class="pad-fabrix__bar"><button class="pad-btn-sm" data-fabrix-action="apply" sc-camel-on-click="{{ fabrixApplySettings }}">설정 적용</button><button class="pad-btn-sm" data-fabrix-action="clear-config" sc-camel-on-click="{{ fabrixClearConfig }}">설정 삭제</button></div>
    <div class="pad-t-12-muted">브라우저 직접 호출에서는 Network 탭에 인증 헤더가 노출됩니다. 승인된 사내 테스트 환경에서만 사용하고, 운영 적용 전 인증 방식을 별도 검토하세요.</div>
  </div>
  </sc-if>
</div>
</sc-if>

<div class="pad-row pad-g14">
<div class="pad-flex1">
<div class="pad-row pad-g8 pad-wrap">
<span class="pad-h1">{{ selName }} 고객님 <span class="pad-b pad-c-sub">[ {{ pfPin }} ]</span></span>
<sc-for as="b" list="{{ bfBadges }}">
<span class="pad-tag-lg" style="color:{{ b.fg }};background:{{ b.bg }}">{{ b.t }}</span>
</sc-for>
</div>
<sc-if value="{{ noAiBrief }}">
<div class="pad-t-13-sub pad-mt2">{{ selMeta }} <span style="color:{{ selPaColor }}">({{ selPa }} 분석)</span></div>
</sc-if>
</div>
<div class="pad-t-12-muted">{{ profileAnalysisLabel }}</div>
</div>
<div class="pad-profile-grid">
<div class="pad-card pad-col pad-g0">
<div class="pad-t-kicker2 pad-mb10">고객 정보</div>
<sc-for as="pr" list="{{ pfRows }}">
<div class="pad-prow">
<span class="pad-t-13-muted pad-none">{{ pr.l }}</span>
<span class="pad-t-13b-dark pad-right">{{ pr.v }}</span>
</div>
</sc-for>
<div class="pad-prow">
<span class="pad-t-13-muted pad-none">IRP 계좌 신규일</span>
<span class="pad-t-13b-dark pad-right">{{ pfAcctDate }}</span>
</div>
<div class="pad-prow-last">
<span class="pad-t-13-muted pad-none">디폴트옵션</span>
<span class="pad-tag-lg" style="color:{{ pfDoFg }};background:{{ pfDoBg }}">{{ pfDo }}</span>
</div>
<sc-if value="{{ structuredBrief }}"><div class="pad-prow-last"><span class="pad-t-13-muted">디폴트옵션 적용</span><span class="pad-t-13b-dark">{{ pfDoApplication }}</span></div></sc-if>
</div>
<div class="pad-card pad-col pad-between pad-g14">
<div class="pad-t-kicker2">IRP 계좌현황</div>
<div class="pad-row pad-g22 pad-flex1">
<div class="pad-donut">
<svg height="132" sc-camel-view-box="0 0 132 132" width="132" class="pad-ring">
<circle cx="66" cy="66" fill="none" r="54" stroke="#F2F3F5" stroke-width="16"></circle>
<sc-for as="pa" list="{{ pfArcs }}">
<circle cx="66" cy="66" fill="none" r="54" stroke="{{ pa.color }}" stroke-dasharray="{{ pa.dash }}" stroke-dashoffset="{{ pa.off }}" stroke-width="16"></circle>
</sc-for>
</svg>
<div class="pad-donut__center">
<span class="pad-t-11b-muted">평가금액</span>
<span class="pad-donut__amt">{{ pfAmt }}</span>
</div>
</div>
<div class="pad-flex1 pad-col pad-g0">
<sc-for as="pp" list="{{ pfPort }}">
<div class="pad-legend">
<span class="pad-legend__sw" style="background:{{ pp.color }}"></span>
<span class="pad-t-13-sub">{{ pp.l }}</span>
<span class="pad-flex1"></span>
<span class="pad-t-13b">{{ pp.v }}</span>
<span class="pad-legend__w">{{ pp.w }}</span>
</div>
</sc-for>
<div class="pad-hr pad-hr--sm"></div>
<div class="pad-legend2">
<span class="pad-t-13-sub">수익률</span>
<span class="pad-flex1"></span>
<span class="pad-t-14b" style="color:{{ pfRetFg }}">({{ pfRet }})</span>
</div>

<div class="pad-t-11b-muted">이어서 물어보실 수 있어요</div>
<sc-for as="fo" list="{{ m.follow }}">
<div class="pad-t-13-sub pad-mt5 pad-keep">· {{ fo.t }}</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ m.ctaOn }}">
<div class="pad-cta pad-in">
<div class="pad-cta__ask">{{ m.ctaAsk }}</div>
<div class="pad-flex pad-g8 pad-mt9">
<button sc-camel-on-click="{{ m.onCtaYes }}" class="pad-btn pad-btn--brand pad-p-7-16">{{ m.ctaYes }}</button>
<button sc-camel-on-click="{{ m.onCtaNo }}" class="pad-btn pad-btn--line pad-p-7-16">아니오</button>
</div>
</div>
</sc-if>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{ agChipsOn }}">
<div class="pad-in-late">
<div class="pad-t-11b-muted pad-mb7">이런 걸 물어보세요</div>
<div class="pad-flex pad-wrap pad-g6">
<sc-for as="ac" list="{{ agChips }}">
<button sc-camel-on-click="{{ ac.onTap }}" class="pad-sugg">{{ ac.label }}</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
<div class="pad-inputbar">
<input disabled="{{ agBusy }}" placeholder="상담 중 필요한 내용을 AI에게 물어보세요" sc-camel-on-change="{{ agOnInput }}" sc-camel-on-key-down="{{ agOnKey }}" value="{{ agInput }}" class="pad-inputbar__input"/>
<button sc-camel-on-click="{{ agSendTap }}" class="pad-send"><sc-if value="{{ agBusy }}"><span class="pad-send__busy"></span></sc-if><sc-if value="{{ agNotBusy }}"><svg height="16" sc-camel-view-box="0 0 16 16" width="16"><path d="M2.5 8h10M9 4.5 12.5 8 9 11.5" fill="none" stroke="#26282C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"></path></svg></sc-if></button>
</div>
</sc-if>
<sc-if value="{{ agentOff }}">
<div class="pad-side__head2">
<div class="pad-row pad-between">
<div class="pad-rowb pad-g8">
<span class="pad-t-14b">대응 가이드</span>
<span class="pad-t-13-muted">{{ selName }}</span>
</div>
<button sc-camel-on-click="{{ togglePanel }}" title="패널 접기" class="pad-icon-btn"><svg height="15" sc-camel-view-box="0 0 16 16" width="15"><polyline fill="none" points="5,3 10,8 5,13" stroke="#9298A2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"></polyline><line stroke="#9298A2" stroke-linecap="round" stroke-width="1.7" x1="13" x2="13" y1="3.5" y2="12.5"></line></svg></button>
</div>
</div>
<div data-scroll-key="guide-chat" ref="{{ chatRef }}" class="chat-scroll pad-chat">
<sc-for as="m" list="{{ msgs }}">
<div class="pad-in">
<sc-if value="{{ m.isBrief }}">
<div class="pad-msg-sys">{{ m.text }}</div>
</sc-if>
<sc-if value="{{ m.isTyping }}">
<div class="pad-flex pad-start"><div class="pad-typing"><span class="pad-tdot pad-d1"></span><span class="pad-tdot pad-d2"></span><span class="pad-tdot"></span></div></div>
</sc-if>
<sc-if value="{{ m.isUser }}">
<div class="pad-flex pad-end"><div class="pad-msg-user">{{ m.text }}</div></div>
</sc-if>
<sc-if value="{{ m.isAi }}">
<div class="pad-col pad-g8">
<div class="pad-guide-card pad-in">
<div class="pad-guide-kicker pad-c-muted">대응 방향</div>
<div class="pad-guide-card__title">{{ m.dirTitle }}</div>
<sc-if value="{{ m.hasWhy }}"><div class="pad-guide-card__why">{{ m.dirWhy }}</div></sc-if>
</div>
<div class="pad-guide-card pad-in-late">
<div class="pad-guide-kicker pad-c-brand">추천 멘트</div>
<div class="pad-quote pad-t-14 pad-mt6">“{{ m.mentShown }}<sc-if value="{{ m.streaming }}"><span class="pad-caret"></span></sc-if>”</div>
<sc-if value="{{ m.hasWarn }}">
<div class="pad-warnline pad-in"><span class="pad-tag-warn">주의</span><span class="pad-warnline__text">{{ m.warn }}</span></div>
</sc-if>
<sc-if value="{{ m.hasSrc }}">
<div class="pad-t-12-muted pad-mt8 pad-in">{{ m.src }}</div>
</sc-if>
</div>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{ hasChips }}">
<div class="pad-in-late">
<div class="pad-t-11b-muted pad-mb7">예상 반응</div>
<div class="pad-flex pad-wrap pad-g6">
<sc-for as="ch" list="{{ chips }}">
<button sc-camel-on-click="{{ ch.onTap }}" class="pad-sugg">“{{ ch.label }}”</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{ hasCommonChips }}">
<div class="pad-flex pad-wrap pad-g6">
<sc-for as="cc" list="{{ commonChips }}">
<button sc-camel-on-click="{{ cc.onTap }}" class="pad-sugg-sm">{{ cc.label }}</button>
</sc-for>
</div>
</sc-if>
</div>
<div class="pad-inputbar">
<input placeholder="고객 발화를 직접 입력해 보세요" sc-camel-on-change="{{ onInput }}" sc-camel-on-key-down="{{ onKeyEnter }}" value="{{ inputVal }}" class="pad-inputbar__input"/>
<button sc-camel-on-click="{{ onSend }}" class="pad-send"><sc-if value="{{ busy }}"><span class="pad-send__busy"></span></sc-if><sc-if value="{{ notBusy }}"><svg height="16" sc-camel-view-box="0 0 16 16" width="16"><path d="M2.5 8h10M9 4.5 12.5 8 9 11.5" fill="none" stroke="#26282C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"></path></svg></sc-if></button>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ panelClosed }}">
<button sc-camel-on-click="{{ togglePanel }}" class="pad-side-toggle">
<svg height="15" sc-camel-view-box="0 0 16 16" width="15"><polyline fill="none" points="11,3 6,8 11,13" stroke="#60584C" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"></polyline><line stroke="#60584C" stroke-linecap="round" stroke-width="1.7" x1="3" x2="3" y1="3.5" y2="12.5"></line></svg>
<span class="pad-side-toggle__label">대응 가이드</span>
</button>
</sc-if>
</div>
</sc-if>
</div>
    </template>
    <div id="pensionAgentMount"></div>
  </div>
</body>
</html>
